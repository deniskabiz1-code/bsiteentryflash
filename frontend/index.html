<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Primeform</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        var wa = window.Telegram && window.Telegram.WebApp;
        if (!wa) return;
        document.documentElement.dataset.tg = '1';
        var safe = wa.safeAreaInset || {};
        var content = wa.contentSafeAreaInset || {};
        var top = wa.isFullscreen
          ? Math.max(content.top || 0, safe.top || 0)
          : Math.max(content.top || 0, (safe.top || 0) + 56, 120);
        document.documentElement.style.setProperty('--tg-content-safe-area-inset-top', top + 'px');
        document.documentElement.style.setProperty('--tg-content-safe-area-inset-bottom', (content.bottom || 0) + 'px');
        document.documentElement.style.setProperty('--tg-content-safe-area-inset-left', (content.left || 0) + 'px');
        document.documentElement.style.setProperty('--tg-content-safe-area-inset-right', (content.right || 0) + 'px');
        wa.ready();
        wa.expand();
        try {
          if (wa.requestFullscreen && !wa.isFullscreen) {
            wa.requestFullscreen();
          }
        } catch (e) {}
        try {
          wa.setHeaderColor('#F5F5F7');
          wa.setBackgroundColor('#F5F5F7');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Build
        env:
          VITE_MOCK_MODE: false
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_CHANNEL_USERNAME: ${{ secrets.VITE_CHANNEL_USERNAME }}
        run: npm run build

      - name: Prepare GitHub Pages output
        run: node scripts/inject-build.mjs "${{ github.sha }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Bust Telegram cache (menu URL)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBAPP_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/update-bot-menu.mjs "${{ github.sha }}"

      - name: Verify live site
        run: |
          PAGE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          for i in $(seq 1 12); do
            HTML=$(curl -fsS "$PAGE_URL" || true)
            if echo "$HTML" | grep -q '${{ github.sha }}'; then
              echo "Live site updated: $PAGE_URL"
              exit 0
            fi
            echo "Waiting for GitHub Pages CDN... ($i/12)"
            sleep 10
          done
          echo "Site deployed but CDN may still be caching — hard-close Telegram to refresh"
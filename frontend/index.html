<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Primeform</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        var wa = window.Telegram && window.Telegram.WebApp;
        if (!wa) return;
        document.documentElement.dataset.tg = '1';
        var safe = (wa.safeAreaInset && wa.safeAreaInset.top) || 0;
        var content = (wa.contentSafeAreaInset && wa.contentSafeAreaInset.top) || 0;
        var top = Math.max(content, safe + 52, 96);
        document.documentElement.style.setProperty('--tg-content-safe-area-inset-top', top + 'px');
        wa.ready();
        wa.expand();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

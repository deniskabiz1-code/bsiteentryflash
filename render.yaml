services:
  - type: web
    name: primeform-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: CHANNEL_USERNAME
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_REASONING_EFFORT
        sync: false
      - key: OPENAI_REASONING_EFFORT_FREE
        sync: false
      - key: OPENAI_REASONING_EFFORT_FULL
        sync: false
      - key: OPENAI_MAX_TOKENS_FREE
        sync: false
      - key: OPENAI_MAX_TOKENS_FULL
        sync: false
      - key: ENABLE_TEST_CREDITS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: ROBOKASSA_LOGIN
        sync: false
      - key: ROBOKASSA_PASSWORD1
        sync: false
      - key: ROBOKASSA_PASSWORD2
        sync: false
      - key: ROBOKASSA_TEST_MODE
        value: "true"
      - key: REMINDER_TIMEZONE
        value: Europe/Moscow

  - type: cron
    name: primeform-reminders
    runtime: node
    schedule: "* * * * *"
    buildCommand: "true"
    startCommand: >-
      curl -fsS -X POST "https://${RENDER_SERVICE_URL}/api/cron/reminders"
      -H "X-Admin-Secret: $ADMIN_SECRET"
    envVars:
      - key: ADMIN_SECRET
        sync: false
      - key: RENDER_SERVICE_URL
        fromService:
          name: primeform-api
          type: web
          property: host